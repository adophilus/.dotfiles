[config]
reload_apps = false

# NOTE: All post_hooks removed — matugen_reload.sh (called by Quickshell after
# wallpaper change) handles app reloading. Matugen 2.4.1 crashes if a post_hook
# command is missing from PATH.

# ── Quickshell color scheme (read by MatugenColors.qml) ──
[templates.quickshell]
input_path = '~/.config/matugen/templates/qs_colors.json.template'
output_path = '/tmp/qs_colors.json'

# ── Qt5/Qt6 QSS styling (output to /tmp since ~/.config/qt5ct is read-only nix symlink) ──
[templates.qt5_style]
input_path = '~/.config/matugen/templates/qt-style.qss.template'
output_path = '/tmp/qt5ct-matugen-style.qss'

[templates.qt6_style]
input_path = '~/.config/matugen/templates/qt-style.qss.template'
output_path = '/tmp/qt6ct-matugen-style.qss'

# ── Firefox userChrome theming ──
[templates.firefox]
input_path = '~/.config/matugen/templates/firefox.css'
output_path = '~/.mozilla/firefox/xi26em3v.default/chrome/matugen.css'

[templates.web_github]
input_path = '~/.config/matugen/templates/websites/github.css.template'
output_path = '~/.mozilla/firefox/xi26em3v.default/chrome/matugen-github.css'

[templates.web_youtube]
input_path = '~/.config/matugen/templates/websites/youtube.css.template'
output_path = '~/.mozilla/firefox/xi26em3v.default/chrome/matugen-youtube.css'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/matugen/generated/gtk-3.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/matugen/generated/gtk-4.css'

[templates.qt5ct]
input_path = '~/.config/matugen/templates/qtct-colors.conf'
output_path = '~/.config/matugen/generated/qt5ct-colors.conf'

[templates.qt6ct]
input_path = '~/.config/matugen/templates/qtct-colors.conf'
