# =================================================================================================
# 1.1. LEFT EXTERNAL MONITOR (WORK)
# =================================================================================================
# Positioned at 0x0. This is the absolute far-left starting point of your desktop canvas.
monitor=HDMI-A-1, preferred, 0x0, 1, bitdepth, 10

# =================================================================================================
# 1.2. INTERNAL LAPTOP DISPLAY (ASUS TUF F15)
# =================================================================================================
# Positioned at 1920x0. This places it exactly to the right of your 1080p HDMI monitor.
# Fixed the resolution string to 1920x1080 so your 40Hz battery saver mode actually works!
monitor=eDP-1, 1920x1080@40, 1920x0, 1

# =================================================================================================
# 1.3. FALLBACK / HOTPLUGGED MONITORS (OFFICE PRESENTATIONS)
# =================================================================================================
# Default to 1080p for unknown displays to avoid GPU strain on 4K screens.
# Use the QS monitor widget to bump resolution up if needed.
# "auto" tells Hyprland to place the new display to the right of existing ones.
monitor=, 1920x1080, auto, 1, bitdepth, 10

# -------------------------------------------------------------------------------------------------
# 1.3. WORKSPACE BINDING (Optional)
# -------------------------------------------------------------------------------------------------
# Useful if you want specific workspaces to always stay on the laptop screen.
# workspace=1, monitor:eDP-1
# workspace=2, monitor:eDP-1
