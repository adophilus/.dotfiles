# AeroSpace config — minimal; unspecified options use compiled-in defaults
# (alt-hjkl focus, alt-1..0 workspaces, alt-shift move, etc.)
#
# Workspaces are pinned per monitor:
#   1-5 → main monitor
#   6-0 → secondary monitor
# 'main' = macOS "Use as Main" display (System Settings → Displays)
[workspace-to-monitor-force-assignment]
    1 = 'main'
    2 = 'main'
    3 = 'main'
    4 = 'main'
    5 = 'main'
    6 = 'secondary'
    7 = 'secondary'
    8 = 'secondary'
    9 = 'secondary'
    0 = 'secondary'
