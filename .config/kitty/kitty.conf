# vim:ft=kitty

## name:     Charcoal (monochrome)
## author:   adophilus
## blurb:    Pure grayscale palette matching the opencode charcoal theme.
## note:     Dynamic colors loaded via matugen (kitty-colors.conf below)



# The basic colors
foreground              #d4d4d4
background              #0d0d0d
selection_foreground    #0d0d0d
selection_background    #555555

# Cursor colors
cursor                  #f4f4f4
cursor_text_color       #0d0d0d

# URL underline color when hovering with mouse
url_color               #b4b4b4

# Kitty window border colors
active_border_color     #555555
inactive_border_color   #333333
bell_border_color       #a0a0a0

# OS Window titlebar colors
wayland_titlebar_color  #0d0d0d
macos_titlebar_color    #0d0d0d

# Tab bar colors
active_tab_foreground   #0d0d0d
active_tab_background   #555555
inactive_tab_foreground #848484
inactive_tab_background #141414
tab_bar_background      #0d0d0d

# Colors for marks (marked text in the terminal)
mark1_foreground #0d0d0d
mark1_background #555555
mark2_foreground #0d0d0d
mark2_background #333333
mark3_foreground #0d0d0d
mark3_background #848484

# The 16 terminal colors
# Monochrome with subtle warm/cool tints so terminal output stays legible

# black
color0 #1e1e1e
color8 #333333

# red
color1 #7a6a6a
color9 #a09090

# green
color2  #6a7a6a
color10 #90a090

# yellow
color3  #7a756a
color11 #a09a90

# blue
color4  #6a707a
color12 #9098a0

# magenta
color5  #756a7a
color13 #9a90a0

# cyan
color6  #6a787a
color14 #90a0a0

# white
color7  #848484
color15 #d4d4d4

# ── Font ──
# font_family      ProFont IIx Nerd Font Mono
# bold_font        ProFont IIx Nerd Font Mono
# italic_font      ProFont IIx Nerd Font Mono
# bold_italic_font ProFont IIx Nerd Font Mono

font_family      Hurmit Nerd Font Mono
bold_font        Hurmit Nerd Font Mono
italic_font      Hurmit Nerd Font Mono
bold_italic_font Hurmit Nerd Font Mono

font_size 12

# ── ilyamiro enhancements ──
# cursor_trail 1
# hide_window_decorations: set per-platform via the kitty-os.conf include below
# window_padding_width 4
confirm_os_window_close 0
enable_audio_bell no
scrollback_lines 2000
wheel_scroll_min_lines 1

disable_ligatures never
# map win+space discard_event
map alt+j no_op
map alt+k no_op
map alt+l no_op

# background_opacity 0.9

# ── Dynamic Matugen Colors (overrides static colors above when available) ──
include /tmp/kitty-matugen-colors.conf

# ── Platform-specific (deployed per-OS by home-manager) ──
include ~/.config/kitty-os.conf
